[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-forge-framework"
version = "0.1.0"
description = "A review-gated memory/source-truth system for teams of AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ray Taylor" }]
keywords = ["ai-agents", "knowledge-management", "automation", "obsidian", "agent-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/raymondgtayloriv-byte/ghost-forge-framework"

[project.scripts]
gf = "ghostforge.cli:main"

[tool.setuptools.packages.find]
include = ["ghostforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
